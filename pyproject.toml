[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]  # errors, pyflakes, warnings
ignore = [
    "E501",  # line too long — docstrings may exceed 100
    "E402",  # module import not at top — imports in get_clients()
]

[tool.ruff.format]
quote-style = "double"